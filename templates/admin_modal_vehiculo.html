<!-- Modal: añadir vehículo (incluido en dashboard y sección Vehículos) -->
<div class="modal fade" id="modalVehiculo" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" method="post" action="{{ url_for('admin_vehiculo_nuevo') }}">
      <input type="hidden" name="destino" value="{{ destino or url_for('admin_vehiculos') }}">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Añadir vehículo a la flota</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Marca *</label>
            <input class="form-control" name="marca" required placeholder="BMW">
          </div>
          <div class="col-md-6">
            <label class="form-label">Modelo *</label>
            <input class="form-control" name="modelo" required placeholder="M4 Competition">
          </div>
          <div class="col-md-4">
            <label class="form-label">Placa *</label>
            <input class="form-control" name="placa" required placeholder="ABC-12-34" style="text-transform:uppercase">
          </div>
          <div class="col-md-4">
            <label class="form-label">Categoría</label>
            <select class="form-select" name="categoria">
              <option value="sedan">Sedán</option>
              <option value="suv">SUV</option>
              <option value="deportivo">Deportivo</option>
              <option value="elegante">Elegante</option>
              <option value="electrico">Eléctrico</option>
              <option value="convertible">Convertible</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Estado inicial</label>
            <select class="form-select" name="estado">
              <option value="disponible">Disponible</option>
              <option value="reservada">Reservada</option>
              <option value="alquilado">Alquilado</option>
              <option value="mantenimiento">Mantenimiento</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Año</label>
            <input class="form-control" name="anio" type="number" min="1980" max="2030" placeholder="2024">
          </div>
          <div class="col-md-4">
            <label class="form-label">Tarifa por día ($) *</label>
            <input class="form-control" name="tarifa_dia" type="number" step="0.01" min="1" required placeholder="250">
          </div>
          <div class="col-md-4">
            <label class="form-label">Precio de venta ($)</label>
            <input class="form-control" name="precio_venta" type="number" step="0.01" min="0" placeholder="89000">
          </div>
          <div class="col-md-4">
            <label class="form-label">Motor</label>
            <input class="form-control" name="motor" placeholder="3.0 L Twin-Turbo">
          </div>
          <div class="col-md-4">
            <label class="form-label">Transmisión</label>
            <select class="form-select" name="transmision">
              <option value="automatica">Automática</option>
              <option value="manual">Manual</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Combustible</label>
            <input class="form-control" name="combustible" placeholder="Gasolina">
          </div>
          <div class="col-md-6">
            <label class="form-label">Kilometraje</label>
            <input class="form-control" name="kilometraje" type="number" min="0" placeholder="0">
          </div>
          <div class="col-md-6">
            <label class="form-label">Imagen</label>
            <input class="form-control" name="imagen_url" list="listaImagenes" placeholder="vehiculo1.jpg">
            <datalist id="listaImagenes">
              <option value="vehiculo1.jpg"></option>
              <option value="vehiculo3.jpg"></option>
              <option value="vehiculo4.jpg"></option>
              <option value="vehiculo5.jpg"></option>
              <option value="vehiculo6.jpg"></option>
              <option value="mercedes.jpg"></option>
              <option value="lambo.jpg"></option>
            </datalist>
            <div class="form-text">Archivo en static/media (vacío = vehiculo1.jpg).</div>
          </div>
          <div class="col-12">
            <label class="form-label">Sucursal</label>
            <select class="form-select" name="sucursal_id">
              <option value="">— Sin asignar —</option>
              {% for s in sucursales %}
              <option value="{{ s.id }}">{{ s.nombre }} ({{ s.ciudad }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" name="descripcion" rows="2" placeholder="Notas del vehículo…"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-an">Guardar vehículo</button>
      </div>
    </form>
  </div>
</div>
